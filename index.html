<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Words Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Arabic Words Test</h1>
            <p class="subtitle">アラビア語単語テスト</p>
        </header>

        <div class="content">
            <!-- Start Screen -->
            <div id="startScreen" class="screen active">
                <h2>ようこそ！</h2>
                <p>アラビア語の単語テストを開始します。</p>
                <button id="startBtn" class="btn btn-primary">Start Test</button>
            </div>

            <!-- Test Screen -->
            <div id="testScreen" class="screen">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <p class="progress-text">Question <span id="currentQuestion">1</span>/<span id="totalQuestions">10</span></p>

                <div class="question-container">
                    <div class="question-arabic" id="questionWord"></div>
                    <p class="question-label">The meaning of this word is:</p>

                    <div class="options" id="optionsContainer"></div>
                </div>

                <div class="navigation">
                    <button id="prevBtn" class="btn btn-secondary">Previous</button>
                    <button id="nextBtn" class="btn btn-primary">Next</button>
                </div>
            </div>

            <!-- Results Screen -->
            <div id="resultsScreen" class="screen">
                <h2>Test Completed!</h2>
                <div class="score-card">
                    <div class="score-value" id="scoreValue">0/10</div>
                    <div class="score-percentage" id="scorePercentage">0%</div>
                </div>

                <div id="resultsList" class="results-list"></div>

                <button id="restartBtn" class="btn btn-primary">Take Test Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
